<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Good Grid</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg:#111; --panel:#1c1c1c; --fg:#eee; --muted:#999; --accent:#4da3ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:15px/1.3 system-ui,-apple-system,Roboto,sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; height:100dvh; }
  #stage { position:relative; flex:1; min-height:0; touch-action:none; overflow:hidden; user-select:none; -webkit-user-select:none; }
  canvas#view { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #empty { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; text-align:center; padding:24px; color:var(--muted); }
  #empty.loaded { display:none; }
  #pick2:not(.show) { display:none; }
  #zoom { position:absolute; top:10px; right:10px; background:rgba(0,0,0,.55); color:#fff; padding:4px 8px;
    border-radius:8px; font-size:13px; font-variant-numeric:tabular-nums; pointer-events:none; opacity:0; transition:opacity .3s; }
  #zoom.show { opacity:1; }
  #ptr { position:absolute; top:0; left:50%; width:40px; height:40px; margin-left:-20px; border-radius:50%;
    background:#2a2a2a; border:1px solid #444; color:var(--fg); display:flex; align-items:center; justify-content:center;
    font-size:22px; pointer-events:none; opacity:0; transform:translateY(-48px); z-index:5; }
  #ptr.ready { background:var(--accent); color:#000; border-color:var(--accent); }
  button, .btn { background:#2a2a2a; color:var(--fg); border:1px solid #3a3a3a; border-radius:10px;
    padding:10px 14px; font:inherit; cursor:pointer; }
  button.primary, .btn.primary { background:var(--accent); border-color:var(--accent); color:#000; font-weight:600; }
  #panel { flex:none; background:var(--panel); border-top:1px solid #2c2c2c;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
  #bar { display:flex; gap:8px; align-items:center; }
  #bar .grow { flex:1; }
  #cropBtn:not(.show) { display:none; }
  body.cropping #bar, body.cropping #opts { display:none; }
  #cropbar { display:none; }
  body.cropping #cropbar { display:block; }
  #cropbar .row { display:flex; gap:8px; align-items:center; }
  #cropbar .row + .row { margin-top:10px; }
  #cropbar button { white-space:nowrap; }
  #cropbar .row:last-child { gap:6px; }
  #cropbar .row:last-child button { padding:10px 11px; }
  #cropbar #cropRot { padding:6px 12px; }
  #cropbar .grow { flex:1; }
  #cropInfo { text-align:center; font-variant-numeric:tabular-nums; line-height:1.15; }
  #cropInfo b { display:block; font-size:16px; }
  #cropInfo small { color:var(--muted); font-size:11px; }
  #ratios { overflow-x:auto; scrollbar-width:none; }
  #ratios button { padding:8px 12px; white-space:nowrap; flex:none; }
  #ratios button.on { background:var(--accent); border-color:var(--accent); color:#000; font-weight:600; }
  #opts { display:grid; grid-template-columns:auto 1fr 3em; gap:8px 12px; align-items:center; margin-top:10px; }
  #opts label { color:var(--muted); white-space:nowrap; }
  #opts output { text-align:right; font-variant-numeric:tabular-nums; }
  #opts .full { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
  #opts .full label { color:var(--fg); display:flex; align-items:center; gap:6px; }
  .num { grid-column:2 / -1; display:flex; align-items:center; gap:6px; }
  .num button { width:44px; padding:8px 0; font-size:18px; line-height:1; }
  .num input { width:72px; text-align:center; background:#111; color:var(--fg); border:1px solid #3a3a3a;
    border-radius:8px; padding:8px 4px; font:inherit; font-size:17px; font-variant-numeric:tabular-nums; }
  .num input:focus { outline:2px solid var(--accent); border-color:transparent; }
  .num .hint { color:var(--muted); font-size:13px; margin-left:4px; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  #width, #alpha { accent-color:var(--line, var(--accent)); }
  input.hue { -webkit-appearance:none; appearance:none; height:28px; background:transparent; margin:0; }
  input.hue::-webkit-slider-runnable-track { height:12px; border-radius:6px;
    background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); }
  input.hue::-moz-range-track { height:12px; border-radius:6px;
    background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); }
  input.hue::-webkit-slider-thumb { -webkit-appearance:none; width:24px; height:24px; margin-top:-6px;
    border-radius:50%; background:var(--hue,#f00); border:3px solid #fff; box-shadow:0 0 0 1px #0006; }
  input.hue::-moz-range-thumb { width:18px; height:18px; border-radius:50%; background:var(--hue,#f00);
    border:3px solid #fff; box-shadow:0 0 0 1px #0006; }
  #tones { display:flex; justify-content:flex-end; gap:6px; }
  #tones button { width:22px; height:22px; padding:0; border-radius:50%; border:1px solid #888; position:relative; }
  #tones button::after { content:''; position:absolute; inset:-10px -3px; } /* bigger tap area */
  #tones button.on { box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
  input.hue.off::-webkit-slider-thumb { background:#555; }
  input.hue.off::-moz-range-thumb { background:#555; }
  input[type=checkbox] { width:20px; height:20px; accent-color:var(--accent); margin:0; }
  input[type=file] { display:none; }
  @media (min-width:700px) { #panel { padding-left:24px; padding-right:24px; } #opts { gap:10px 16px; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="empty">
    <div class="msg" style="font-size:20px;color:var(--fg)">Good Grid</div>
    <div class="msg">Load a photo to overlay a drawing grid.<br>Pinch to zoom, drag to move, double-tap to fit.</div>
    <button id="pick" class="primary">Choose photo</button>
  </div>
  <div id="zoom"></div>
  <div id="ptr">&#x21bb;</div>
</div>

<div id="panel">
  <div id="bar">
    <button id="pick2">New photo</button>
    <button id="cropBtn">Crop</button>
    <span class="grow"></span>
    <button id="fit" title="Fit to screen">Fit</button>
    <button id="export" class="primary">Export</button>
  </div>
  <div id="cropbar">
    <div class="row" id="ratios">
      <button data-r="0" class="on">Free</button>
      <button data-r="1">1:1</button>
      <button data-r="0.8">4:5</button>
      <button data-r="1.25">5:4</button>
      <button data-r="0.75">3:4</button>
      <button data-r="1.3333333">4:3</button>
      <button data-r="0.6666667">2:3</button>
      <button data-r="1.5">3:2</button>
      <button data-r="0.5625">9:16</button>
      <button data-r="1.7777778">16:9</button>
      <button data-r="0.7071068">A4 ▯</button>
      <button data-r="1.4142136">A4 ▭</button>
      <button data-r="0.4285714">9:21</button>
      <button data-r="2.3333333">21:9</button>
    </div>
    <div class="row">
      <button id="cropRot" aria-label="Rotate 90°" title="Rotate 90°" style="font-size:18px">⟳</button>
      <button id="cropReset">Reset</button>
      <span class="grow" id="cropInfo"></span>
      <button id="cropCancel">Cancel</button>
      <button id="cropDone" class="primary">Done</button>
    </div>
  </div>
  <div id="opts">
    <label for="cols">Columns</label>
    <div class="num"><button data-for="cols" data-d="-1" aria-label="Fewer columns">−</button><input id="cols" type="text" inputmode="numeric" autocomplete="off" value="5"><button data-for="cols" data-d="1" aria-label="More columns">+</button><span class="hint" id="colsH"></span></div>
    <label for="rows">Rows</label>
    <div class="num"><button data-for="rows" data-d="-1" aria-label="Fewer rows">−</button><input id="rows" type="text" inputmode="numeric" autocomplete="off" value="5"><button data-for="rows" data-d="1" aria-label="More rows">+</button><span class="hint" id="rowsH"></span></div>
    <label for="width">Line width</label><input id="width" type="range" min="0" max="9" step="1" value="3"><output id="widthO"></output>
    <label for="hue">Color</label><input id="hue" class="hue" type="range" min="0" max="359" value="3"><div id="tones"><button data-tone="black" style="background:#000" aria-label="Black"></button><button data-tone="white" style="background:#fff" aria-label="White"></button></div>
    <label for="alpha">Opacity</label><input id="alpha" type="range" min="10" max="100" value="100"><output id="alphaO"></output>
    <div class="full">
      <label><input id="square" type="checkbox" checked> Square grid</label>
      <label><input id="diag" type="checkbox"> Diagonals</label>
      <label><input id="edges" type="checkbox"> Edge numbers</label>
      <label><input id="gray" type="checkbox"> Black &amp; white</label>
    </div>
  </div>
</div>

<input id="file" type="file" accept="image/*">

<script>
(() => {
  const $ = id => document.getElementById(id);
  const view = $('view'), ctx = view.getContext('2d');
  const stage = $('stage');
  const ui = ['square','width','alpha','hue','diag','edges','gray'];
  const KEY = 'goodgrid.settings.v4';
  const MAXN = 100;
  // Line width: 10 roughly geometric steps (screen px).
  const WIDTHS = [0.1, 0.15, 0.25, 0.4, 0.6, 0.9, 1.4, 2, 3, 5];
  const posToWidth = p => WIDTHS[Math.min(9, Math.max(0, Math.round(p)))];
  const widthToPos = w => { let b = 0; for (let i = 1; i < WIDTHS.length; i++) if (Math.abs(Math.log(WIDTHS[i] / w)) < Math.abs(Math.log(WIDTHS[b] / w))) b = i; return b; };

  let img = null, imgW = 0, imgH = 0;   // working image = original, rotated and cropped
  let orig = null;                       // original photo as loaded
  let crop = null;                       // { rot, x, y, w, h, r } in rotated-original pixels; r = locked ratio w/h (0 = free)
  let cropping = false, cropBackup = null, rotCache = null;
  let grayCache = null;
  let scale = 1, ox = 0, oy = 0;      // screen = img*scale + o
  let dpr = window.devicePixelRatio || 1;
  let tone = 'hue';                   // 'hue' | 'black' | 'white'
  let anchor = 'cols';                // in square mode: which count the user set last
  const counts = { cols: 5, rows: 5 };  // integer counts typed by the user

  // ---------- settings ----------
  function settings() {
    return {
      square: $('square').checked,
      cols: counts.cols,
      rows: counts.rows,
      width: posToWidth(+$('width').value),
      alpha: +$('alpha').value / 100,
      color: tone === 'black' ? '#000' : tone === 'white' ? '#fff' : `hsl(${+$('hue').value},100%,50%)`,
      diag: $('diag').checked,
      edges: $('edges').checked,
      gray: $('gray').checked,
    };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ ...settings(), anchor, tone })); } catch {} }
  function load() {
    let s; try { s = JSON.parse(localStorage.getItem(KEY)); } catch {}
    if (!s) return;
    if (s.anchor === 'rows' || s.anchor === 'cols') anchor = s.anchor;
    if (['hue', 'black', 'white'].includes(s.tone)) tone = s.tone;
    for (const k of ['cols', 'rows']) if (Number.isInteger(s[k]) && s[k] >= 1) counts[k] = Math.min(MAXN, s[k]);
    for (const k of ui) {
      if (!(k in s)) continue;
      const el = $(k);
      if (el.type === 'checkbox') el.checked = !!s[k];
      else el.value = k === 'alpha' ? Math.round(s[k] * 100) : k === 'width' ? widthToPos(+s[k]) : s[k];
    }
  }

  // Effective grid. Square mode: cells are exact squares sized from the count the user set last;
  // the other count follows the image aspect and may end with a partial row/column.
  function grid(s, W = imgW, H = imgH) {
    if (s.square && W) {
      if (anchor === 'rows') { const cell = H / s.rows; return { cols: W / cell, rows: s.rows, cellW: cell, cellH: cell }; }
      const cell = W / s.cols; return { cols: s.cols, rows: H / cell, cellW: cell, cellH: cell };
    }
    return { cols: s.cols, rows: s.rows, cellW: W / s.cols, cellH: H / s.rows };
  }
  const fmt = n => Math.abs(n - Math.round(n)) < 0.05 ? String(Math.round(n)) : n.toFixed(1);

  // Pick a "reasonable" square grid for this photo: about 5 cells on the short side,
  // preferring counts where the long side also comes out (almost) whole.
  function autoGrid() {
    const ar = Math.max(imgW, imgH) / Math.min(imgW, imgH);
    let best = 5, bestDist = Infinity;
    for (let n = 3; n <= 8; n++) {
      const long = Math.round(n * ar), err = Math.abs(long / n - ar) / ar;
      const dist = Math.abs(n - 5);
      if (err <= 0.02 && (dist < bestDist || (dist === bestDist && n < best))) { best = n; bestDist = dist; }
    }
    anchor = imgW <= imgH ? 'cols' : 'rows';
    counts[anchor] = best;
  }
  function syncUI() {
    const s = settings(), g = imgW ? grid(s) : s;
    for (const k of ['cols', 'rows']) {
      const el = $(k), follower = s.square && imgW && k !== anchor;
      if (document.activeElement !== el) el.value = follower ? fmt(g[k]) : counts[k];
      $(k + 'H').textContent = follower ? 'auto' : '';
    }
    $('widthO').textContent = s.width;
    $('alphaO').textContent = Math.round(s.alpha * 100) + '%';
    $('hue').style.setProperty('--hue', `hsl(${+$('hue').value},100%,50%)`);
    $('hue').classList.toggle('off', tone !== 'hue');
    // black would vanish on the dark panel: show it as mid gray
    $('opts').style.setProperty('--line', tone === 'black' ? '#777' : s.color);
    for (const b of document.querySelectorAll('#tones button')) b.classList.toggle('on', b.dataset.tone === tone);
  }

  // ---------- drawing ----------
  // Draws image + grid in image coordinates. `unit` = image px per screen px of line width.
  function drawScene(c, s, unit) {
    c.drawImage(s.gray ? grayCache : img, 0, 0, imgW, imgH);
    const g = grid(s);
    const nc = Math.ceil(g.cols - 1e-6), nr = Math.ceil(g.rows - 1e-6);
    c.save();
    c.beginPath(); c.rect(0, 0, imgW, imgH); c.clip();
    c.globalAlpha = s.alpha;
    c.strokeStyle = s.color;
    c.lineWidth = s.width * unit;
    c.beginPath();
    for (let i = 1; i < nc; i++) { const x = i * g.cellW; c.moveTo(x, 0); c.lineTo(x, imgH); }
    for (let j = 1; j < nr; j++) { const y = j * g.cellH; c.moveTo(0, y); c.lineTo(imgW, y); }
    c.rect(0, 0, imgW, imgH);
    c.stroke();
    if (s.diag) {
      c.lineWidth = s.width * 0.6 * unit;
      c.beginPath();
      for (let i = 0; i < nc; i++) for (let j = 0; j < nr; j++) {
        const x0 = i * g.cellW, y0 = j * g.cellH, x1 = x0 + g.cellW, y1 = y0 + g.cellH;
        c.moveTo(x0, y0); c.lineTo(x1, y1);
        c.moveTo(x1, y0); c.lineTo(x0, y1);
      }
      c.stroke();
    }
    if (s.edges) {
      // Column numbers along the top edge, row numbers along the left edge, centred on each cell.
      const fs = Math.max(Math.min(g.cellW, g.cellH) * 0.16, 11 * unit);
      c.globalAlpha = Math.min(1, s.alpha + 0.1);
      c.font = `600 ${fs}px system-ui,sans-serif`;
      c.textBaseline = 'middle'; c.textAlign = 'center';
      const pad = fs * 0.3, h = fs + pad, top = c.lineWidth + pad * 0.5 + h / 2;
      const tag = (t, x, y) => {
        const w = c.measureText(t).width + pad * 2;
        c.fillStyle = 'rgba(0,0,0,0.45)'; c.fillRect(x - w / 2, y - h / 2, w, h);
        c.fillStyle = s.color; c.fillText(t, x, y + fs * 0.04);
      };
      for (let i = 0; i < nc; i++) {
        const x = Math.min(i * g.cellW + g.cellW / 2, (i * g.cellW + imgW) / 2);
        if (x + fs > imgW) continue;
        tag(String(i + 1), x, top);
      }
      for (let j = 0; j < nr; j++) {
        const y = Math.min(j * g.cellH + g.cellH / 2, (j * g.cellH + imgH) / 2);
        if (y + h / 2 > imgH) continue;
        const t = String(j + 1), w = c.measureText(t).width + pad * 2;
        tag(t, c.lineWidth + pad * 0.5 + w / 2, y);
      }
      c.textAlign = 'start';
    }
    c.restore();
  }

  let raf = 0;
  function render() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(); }); }
  function paint() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#111'; ctx.fillRect(0, 0, view.width, view.height);
    if (!img) return;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, ox * dpr, oy * dpr);
    ctx.imageSmoothingQuality = 'high';
    if (cropping) drawCrop(ctx, 1 / scale);
    else drawScene(ctx, settings(), 1 / scale);
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    const r = stage.getBoundingClientRect();
    view.width = Math.round(r.width * dpr);
    view.height = Math.round(r.height * dpr);
    render();
  }
  // Size of what is on screen: the working image, or the whole rotated original while cropping.
  function dims() { if (cropping) { const s = rotSource(); return [s.width, s.height]; } return [imgW, imgH]; }
  function fitScale() { const r = stage.getBoundingClientRect(), m = cropping ? 24 : 12, [w, h] = dims(); return Math.min((r.width - 2 * m) / w, (r.height - 2 * m) / h); }
  function fit() {
    if (!img) return;
    const r = stage.getBoundingClientRect(), [w, h] = dims();
    scale = fitScale();
    ox = (r.width - w * scale) / 2;
    oy = (r.height - h * scale) / 2;
    render();
  }

  // ---------- image loading ----------
  async function loadFile(f) {
    if (!f) return;
    let bmp;
    try { bmp = await createImageBitmap(f, { imageOrientation: 'from-image' }); }
    catch {
      bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(f); });
    }
    orig = bmp; rotCache = null;
    crop = { rot: 0, x: 0, y: 0, w: bmp.width, h: bmp.height, r: 0 };
    if (cropping) exitCrop(false);
    applyCrop();
    $('empty').classList.add('loaded'); $('pick2').classList.add('show'); $('cropBtn').classList.add('show');
    if ($('square').checked) autoGrid();
    syncUI(); save(); fit();
  }
  // Rotated original (cached per rotation).
  function rotSource() {
    if (crop.rot === 0) return orig;
    if (rotCache && rotCache.rot === crop.rot) return rotCache.c;
    const W = orig.width, H = orig.height, side = crop.rot % 180 !== 0;
    const c = document.createElement('canvas');
    c.width = side ? H : W; c.height = side ? W : H;
    const g = c.getContext('2d');
    g.translate(c.width / 2, c.height / 2); g.rotate(crop.rot * Math.PI / 180); g.drawImage(orig, -W / 2, -H / 2);
    rotCache = { rot: crop.rot, c };
    return c;
  }
  // Build the working image from original + crop, then the grayscale copy.
  function applyCrop() {
    const src = rotSource(), x = Math.round(crop.x), y = Math.round(crop.y);
    const w = Math.max(1, Math.round(crop.w)), h = Math.max(1, Math.round(crop.h));
    if (crop.rot === 0 && x === 0 && y === 0 && w === src.width && h === src.height) img = src;
    else { const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(src, x, y, w, h, 0, 0, w, h); img = c; }
    imgW = img.width; imgH = img.height;
    grayCache = document.createElement('canvas');
    grayCache.width = imgW; grayCache.height = imgH;
    const g = grayCache.getContext('2d');
    // Manual luminance: ctx.filter is not applied reliably on every mobile browser.
    g.drawImage(img, 0, 0);
    const d = g.getImageData(0, 0, imgW, imgH), a = d.data;
    for (let k = 0; k < a.length; k += 4) { const y = a[k] * .299 + a[k + 1] * .587 + a[k + 2] * .114; a[k] = a[k + 1] = a[k + 2] = y; }
    g.putImageData(d, 0, 0);
  }

  // ---------- crop mode ----------
  const HANDLE = 26; // touch radius in screen px
  function drawCrop(c, unit) {
    const src = rotSource(), W = src.width, H = src.height, k = crop;
    c.drawImage(src, 0, 0);
    c.fillStyle = 'rgba(0,0,0,0.6)';
    c.beginPath(); c.rect(0, 0, W, H); c.rect(k.x, k.y, k.w, k.h); c.fill('evenodd');
    // preview of the grid you'll get, thin (0.4 px)
    const s = settings(), g = grid(s, k.w, k.h);
    c.save(); c.beginPath(); c.rect(k.x, k.y, k.w, k.h); c.clip();
    c.strokeStyle = s.color; c.globalAlpha = 0.8; c.lineWidth = 0.4 * unit;
    c.beginPath();
    for (let i = 1; i < Math.ceil(g.cols - 1e-6); i++) { const x = k.x + i * g.cellW; c.moveTo(x, k.y); c.lineTo(x, k.y + k.h); }
    for (let j = 1; j < Math.ceil(g.rows - 1e-6); j++) { const y = k.y + j * g.cellH; c.moveTo(k.x, y); c.lineTo(k.x + k.w, y); }
    c.stroke(); c.restore();
    showCropInfo();
    c.strokeStyle = '#fff'; c.lineWidth = 2 * unit; c.strokeRect(k.x, k.y, k.w, k.h);
    // corner brackets
    const L = Math.min(22 * unit, k.w / 3, k.h / 3), t = 4 * unit;
    c.fillStyle = '#fff';
    for (const [cx, cy, sx, sy] of [[k.x, k.y, 1, 1], [k.x + k.w, k.y, -1, 1], [k.x, k.y + k.h, 1, -1], [k.x + k.w, k.y + k.h, -1, -1]]) {
      c.fillRect(sx > 0 ? cx - t / 2 : cx - L + t / 2, sy > 0 ? cy - t / 2 : cy - t / 2, L, t);
      c.fillRect(cx - t / 2, sy > 0 ? cy - t / 2 : cy - L + t / 2, t, L);
    }
    if (!k.r) { // edge ticks (edges are draggable only in free mode)
      const e = Math.min(18 * unit, k.w / 4, k.h / 4);
      c.fillRect(k.x + k.w / 2 - e, k.y - t / 2, 2 * e, t); c.fillRect(k.x + k.w / 2 - e, k.y + k.h - t / 2, 2 * e, t);
      c.fillRect(k.x - t / 2, k.y + k.h / 2 - e, t, 2 * e); c.fillRect(k.x + k.w - t / 2, k.y + k.h / 2 - e, t, 2 * e);
    }
  }
  function ratioText(w, h) {
    const r = w / h;
    for (let q = 1; q <= 10; q++) { const p = Math.round(r * q); if (p >= 1 && Math.abs(p / q - r) / r < 0.006) return p + ':' + q; }
    return r >= 1 ? r.toFixed(2) + ':1' : '1:' + (1 / r).toFixed(2);
  }
  function showCropInfo() {
    const w = Math.round(crop.w), h = Math.round(crop.h);
    $('cropInfo').innerHTML = `<b>${ratioText(w, h)}</b><small>${w}×${h}</small>`;
  }
  const toImg = p => ({ x: (p.x - ox) / scale, y: (p.y - oy) / scale });
  // What the finger grabbed: corner, edge, the inside (move) or nothing.
  function cropHit(p) {
    const q = toImg(p), k = crop, tol = HANDLE / scale;
    const nl = Math.abs(q.x - k.x) < tol, nr = Math.abs(q.x - (k.x + k.w)) < tol;
    const nt = Math.abs(q.y - k.y) < tol, nb = Math.abs(q.y - (k.y + k.h)) < tol;
    const inX = q.x > k.x - tol && q.x < k.x + k.w + tol, inY = q.y > k.y - tol && q.y < k.y + k.h + tol;
    if (!inX || !inY) return null;
    const h = (nl ? 'w' : nr ? 'e' : '') ; const v = (nt ? 'n' : nb ? 's' : '');
    if (h && v) return v + h;
    if (!k.r && (h || v)) return v || h;
    if (q.x > k.x && q.x < k.x + k.w && q.y > k.y && q.y < k.y + k.h) return 'move';
    return null;
  }
  const MINC = 24; // min crop size, screen px
  function cropDrag(d, start, p) {
    const src = rotSource(), W = src.width, H = src.height, a = start.rect;
    const q = toImg(p), q0 = toImg(start.p), dx = q.x - q0.x, dy = q.y - q0.y, min = MINC / scale;
    const k = crop;
    if (d === 'move') {
      k.x = Math.min(W - a.w, Math.max(0, a.x + dx)); k.y = Math.min(H - a.h, Math.max(0, a.y + dy)); return;
    }
    let l = a.x, t = a.y, r = a.x + a.w, b = a.y + a.h;
    if (d.includes('w')) l = Math.min(r - min, Math.max(0, a.x + dx));
    if (d.includes('e')) r = Math.max(l + min, Math.min(W, a.x + a.w + dx));
    if (d.includes('n')) t = Math.min(b - min, Math.max(0, a.y + dy));
    if (d.includes('s')) b = Math.max(t + min, Math.min(H, a.y + a.h + dy));
    if (k.r && d.length === 2) {
      // keep ratio, anchored at the opposite corner; limited by the photo bounds
      const ax = d.includes('w') ? r : l, ay = d.includes('n') ? b : t;
      let w = r - l, h = b - t;
      if (w / h > k.r) w = h * k.r; else h = w / k.r;
      const maxW = d.includes('w') ? ax : W - ax, maxH = d.includes('n') ? ay : H - ay;
      if (w > maxW) { w = maxW; h = w / k.r; }
      if (h > maxH) { h = maxH; w = h * k.r; }
      l = d.includes('w') ? ax - w : ax; r = l + w;
      t = d.includes('n') ? ay - h : ay; b = t + h;
    }
    k.x = l; k.y = t; k.w = r - l; k.h = b - t;
  }
  // Pinch: scale the frame around its centre (ratio kept), follow the fingers' midpoint.
  function cropPinch(st, cur) {
    const src = rotSource(), W = src.width, H = src.height, a = st.rect, k = crop;
    let f = st.s0.d > 0 ? cur.d / st.s0.d : 1;
    const min = MINC / scale;
    f = Math.max(f, min / a.w, min / a.h);
    f = Math.min(f, W / a.w, H / a.h);
    const w = a.w * f, h = a.h * f;
    const cx = a.x + a.w / 2 + (cur.x - st.s0.x) / scale, cy = a.y + a.h / 2 + (cur.y - st.s0.y) / scale;
    k.w = w; k.h = h;
    k.x = Math.min(W - w, Math.max(0, cx - w / 2)); k.y = Math.min(H - h, Math.max(0, cy - h / 2));
  }
  // Largest rect with ratio r centred on the current crop, inside the photo.
  function setRatio(r) {
    const src = rotSource(), W = src.width, H = src.height, k = crop;
    k.r = r;
    if (!r) return;
    let w = W, h = w / r; if (h > H) { h = H; w = h * r; }
    const cx = k.x + k.w / 2, cy = k.y + k.h / 2;
    k.x = Math.min(W - w, Math.max(0, cx - w / 2)); k.y = Math.min(H - h, Math.max(0, cy - h / 2)); k.w = w; k.h = h;
  }
  function markRatio() {
    let best = null;
    for (const b of document.querySelectorAll('#ratios button')) {
      const r = +b.dataset.r; b.classList.remove('on');
      if (Math.abs(r - crop.r) < 1e-3) best = b;
    }
    if (best) best.classList.add('on');
  }
  function enterCrop() {
    if (!img) return;
    cropping = true; cropBackup = { ...crop };
    document.body.classList.add('cropping'); markRatio(); fit();
  }
  function exitCrop(apply) {
    if (!apply && cropBackup) crop = cropBackup;
    cropping = false; cropBackup = null; drag = null;
    document.body.classList.remove('cropping');
    if (apply) { applyCrop(); syncUI(); }
    fit();
  }
  let drag = null; // { d, p, rect }
  $('file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });

  // ---------- gestures: pinch zoom, pan, wheel, double-tap ----------
  const pts = new Map();
  let last = null, lastTap = 0, zoomTimer = 0;
  function showZoom() {
    const z = $('zoom');
    z.textContent = Math.round(scale / fitScale() * 100) + '%';
    z.classList.add('show');
    clearTimeout(zoomTimer); zoomTimer = setTimeout(() => z.classList.remove('show'), 900);
  }
  function zoomAt(f, cx, cy) {
    if (!img) return;
    const fs = fitScale();
    const ns = Math.min(fs * 30, Math.max(fs * 0.5, scale * f));
    f = ns / scale;
    ox = cx - (cx - ox) * f; oy = cy - (cy - oy) * f; scale = ns;
    showZoom(); render();
  }
  function local(e) { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function snapshot() {
    const a = [...pts.values()];
    if (a.length === 1) return { x: a[0].x, y: a[0].y, d: 0, n: 1 };
    const [p, q] = a;
    return { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2, d: Math.hypot(p.x - q.x, p.y - q.y), n: 2 };
  }
  // ---------- pull to refresh ----------
  // Without a photo: pull down anywhere. With a photo: only from the top edge, so it doesn't fight panning.
  const PULL_EDGE = 44, PULL_GO = 90;
  let pull = null; // { id, y0, dy }
  function showPull(dy) {
    const el = $('ptr'), d = Math.min(dy, PULL_GO * 1.4);
    el.style.transition = 'none';
    el.style.opacity = Math.min(1, d / PULL_GO);
    el.style.transform = `translateY(${d * 0.7 - 48}px) rotate(${d * 3}deg)`;
    el.classList.toggle('ready', dy >= PULL_GO);
  }
  function hidePull() {
    const el = $('ptr');
    el.style.transition = 'transform .2s, opacity .2s';
    el.style.opacity = 0; el.style.transform = 'translateY(-48px)'; el.classList.remove('ready');
  }
  function endPull(go) {
    pull = null; hidePull();
    if (go && (!img || confirm('Reload the app? The current photo will be removed.'))) location.reload();
  }

  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return; // let the photo button get its tap
    if (cropping) {
      try { stage.setPointerCapture(e.pointerId); } catch {}
      pts.set(e.pointerId, local(e)); last = snapshot();
      if (pts.size === 1) { const d = cropHit(local(e)); drag = d ? { d, p: local(e), rect: { ...crop } } : null; }
      else if (pts.size === 2) drag = { d: 'pinch', s0: last, rect: { ...crop } }; // two fingers: resize + move the frame
      else drag = null;
      return;
    }
    if (pts.size === 0 && e.isPrimary && (!img || local(e).y < PULL_EDGE)) pull = { id: e.pointerId, y0: local(e).y, dy: 0 };
    else if (pull) { endPull(false); }
    try { stage.setPointerCapture(e.pointerId); } catch {}
    pts.set(e.pointerId, local(e));
    last = snapshot();
    if (pts.size === 1) {
      const now = Date.now();
      if (now - lastTap < 300) { fit(); showZoom(); lastTap = 0; } else lastTap = now;
    } else lastTap = 0;
  });
  stage.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, local(e));
    if (cropping) {
      if (drag && drag.d === 'pinch' && pts.size === 2) { cropPinch(drag, snapshot()); render(); return; }
      if (drag && drag.d !== 'pinch' && pts.size === 1) { cropDrag(drag.d, drag, local(e)); last = snapshot(); render(); return; }
      if (drag) return;
    }
    if (pull && pull.id === e.pointerId) {
      pull.dy = local(e).y - pull.y0;
      if (pull.dy > 8) { showPull(pull.dy); last = snapshot(); return; } // pulling: don't pan
    }
    const cur = snapshot();
    if (!img || !last || cur.n !== last.n) { last = cur; return; }
    ox += cur.x - last.x; oy += cur.y - last.y;
    if (cur.n === 2 && last.d > 0) zoomAt(cur.d / last.d, cur.x, cur.y);
    last = cur; render();
  });
  const up = e => {
    if (pull && pull.id === e.pointerId) endPull(e.type === 'pointerup' && pull.dy >= PULL_GO);
    pts.delete(e.pointerId); last = pts.size ? snapshot() : null;
    if (!pts.size || (drag && drag.d === 'pinch')) drag = null;
  };
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', e => { e.preventDefault(); const p = local(e); zoomAt(Math.exp(-e.deltaY * 0.0015), p.x, p.y); }, { passive: false });

  // ---------- controls ----------
  for (const k of ui) $(k).addEventListener('input', () => { if (k === 'hue') tone = 'hue'; syncUI(); save(); render(); });
  $('hue').addEventListener('pointerdown', () => { if (tone !== 'hue') { tone = 'hue'; syncUI(); save(); render(); } });
  for (const b of document.querySelectorAll('#tones button'))
    b.addEventListener('click', () => { tone = b.dataset.tone; syncUI(); save(); render(); });
  // Turning square off: freeze the auto count to a whole number.
  $('square').addEventListener('change', () => {
    if (!$('square').checked && imgW) {
      const other = anchor === 'cols' ? 'rows' : 'cols';
      counts[other] = Math.max(1, Math.round(grid({ ...settings(), square: true })[other]));
    }
    syncUI(); save(); render();
  });
  function setCount(k, n) {
    counts[k] = Math.max(1, Math.min(MAXN, Math.round(n)));
    anchor = k;
    syncUI(); save(); render();
  }
  for (const k of ['cols', 'rows']) {
    const el = $(k);
    el.addEventListener('focus', () => el.select());
    el.addEventListener('input', () => { const n = parseFloat(el.value.replace(',', '.')); if (n >= 1) setCount(k, n); });
    el.addEventListener('change', () => { el.value = ''; el.blur(); syncUI(); });
    el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); });
    el.addEventListener('blur', () => syncUI());
  }
  for (const b of document.querySelectorAll('.num button')) b.addEventListener('click', () => {
    const k = b.dataset.for, s = settings();
    const cur = s.square && imgW && k !== anchor ? grid(s)[k] : counts[k];
    const d = +b.dataset.d, c = Math.round(cur * 10) / 10;
    setCount(k, d > 0 ? Math.floor(c) + 1 : Math.ceil(c) - 1);
  });
  $('fit').addEventListener('click', fit);
  $('pick').addEventListener('click', () => $('file').click());
  $('pick2').addEventListener('click', () => $('file').click());
  $('cropBtn').addEventListener('click', enterCrop);
  $('cropDone').addEventListener('click', () => exitCrop(true));
  $('cropCancel').addEventListener('click', () => exitCrop(false));
  $('cropReset').addEventListener('click', () => {
    crop = { rot: 0, x: 0, y: 0, w: orig.width, h: orig.height, r: 0 }; markRatio(); fit();
  });
  $('cropRot').addEventListener('click', () => {
    // rotate 90° clockwise; the crop rect and the locked ratio rotate with the photo
    const H = rotSource().height, k = crop;
    crop = { rot: (k.rot + 90) % 360, x: H - (k.y + k.h), y: k.x, w: k.h, h: k.w, r: k.r ? 1 / k.r : 0 };
    markRatio(); fit();
  });
  for (const b of document.querySelectorAll('#ratios button'))
    b.addEventListener('click', () => { setRatio(+b.dataset.r); markRatio(); render(); });

  $('export').addEventListener('click', async () => {
    if (!img) { $('file').click(); return; }
    const c = document.createElement('canvas');
    c.width = imgW; c.height = imgH;
    drawScene(c.getContext('2d'), settings(), 1 / fitScale()); // line width as seen at "fit" zoom
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    const name = `grid-${Date.now()}.png`;
    const file = new File([blob], name, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Good Grid' }); return; }
      catch (err) { if (err.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  });

  if ('launchQueue' in window) {
    launchQueue.setConsumer(async p => { if (p.files && p.files.length) loadFile(await p.files[0].getFile()); });
  }

  new ResizeObserver(() => { resize(); if (img) fit(); }).observe(stage);
  load(); syncUI(); resize();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
