<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Good Grid</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg:#111; --panel:#1c1c1c; --fg:#eee; --muted:#999; --accent:#4da3ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:15px/1.3 system-ui,-apple-system,Roboto,sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; height:100dvh; }
  #stage { position:relative; flex:1; min-height:0; touch-action:none; overflow:hidden; }
  canvas#view { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #empty { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; text-align:center; padding:24px; color:var(--muted); }
  #empty.loaded { inset:auto; top:10px; left:10px; padding:0; }
  #empty.loaded .msg { display:none; }
  #empty.loaded #pick { padding:8px 12px; background:rgba(0,0,0,.6); border-color:#555; color:#fff; font-weight:500; }
  #zoom { position:absolute; top:10px; right:10px; background:rgba(0,0,0,.55); color:#fff; padding:4px 8px;
    border-radius:8px; font-size:13px; font-variant-numeric:tabular-nums; pointer-events:none; opacity:0; transition:opacity .3s; }
  #zoom.show { opacity:1; }
  button, .btn { background:#2a2a2a; color:var(--fg); border:1px solid #3a3a3a; border-radius:10px;
    padding:10px 14px; font:inherit; cursor:pointer; }
  button.primary, .btn.primary { background:var(--accent); border-color:var(--accent); color:#000; font-weight:600; }
  #panel { flex:none; background:var(--panel); border-top:1px solid #2c2c2c;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
  #bar { display:flex; gap:8px; align-items:center; }
  #bar .grow { flex:1; }
  #opts { display:grid; grid-template-columns:auto 1fr 3em; gap:8px 12px; align-items:center; margin-top:10px; }
  #opts label { color:var(--muted); white-space:nowrap; }
  #opts output { text-align:right; font-variant-numeric:tabular-nums; }
  #opts .full { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
  #opts .full label { color:var(--fg); display:flex; align-items:center; gap:6px; }
  .num { grid-column:2 / -1; display:flex; align-items:center; gap:6px; }
  .num button { width:44px; padding:8px 0; font-size:18px; line-height:1; }
  .num input { width:72px; text-align:center; background:#111; color:var(--fg); border:1px solid #3a3a3a;
    border-radius:8px; padding:8px 4px; font:inherit; font-size:17px; font-variant-numeric:tabular-nums; }
  .num input:focus { outline:2px solid var(--accent); border-color:transparent; }
  .num .hint { color:var(--muted); font-size:13px; margin-left:4px; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  input[type=color] { width:40px; height:28px; border:none; background:none; padding:0; }
  input[type=checkbox] { width:20px; height:20px; accent-color:var(--accent); margin:0; }
  input[type=file] { display:none; }
  @media (min-width:700px) { #panel { padding-left:24px; padding-right:24px; } #opts { gap:10px 16px; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="empty">
    <div class="msg" style="font-size:20px;color:var(--fg)">Good Grid</div>
    <div class="msg">Load a photo to overlay a drawing grid.<br>Pinch to zoom, drag to move, double-tap to fit.</div>
    <button id="pick" class="primary">Choose photo</button>
  </div>
  <div id="zoom"></div>
</div>

<div id="panel">
  <div id="bar">
    <span class="grow"></span>
    <button id="fit" title="Fit to screen">Fit</button>
    <button id="export" class="primary">Export</button>
  </div>
  <div id="opts">
    <label for="cols">Columns</label>
    <div class="num"><button data-for="cols" data-d="-1" aria-label="Fewer columns">−</button><input id="cols" type="text" inputmode="numeric" autocomplete="off" value="5"><button data-for="cols" data-d="1" aria-label="More columns">+</button><span class="hint" id="colsH"></span></div>
    <label for="rows">Rows</label>
    <div class="num"><button data-for="rows" data-d="-1" aria-label="Fewer rows">−</button><input id="rows" type="text" inputmode="numeric" autocomplete="off" value="5"><button data-for="rows" data-d="1" aria-label="More rows">+</button><span class="hint" id="rowsH"></span></div>
    <label for="width">Line width</label><input id="width" type="range" min="1" max="20" value="3"><output id="widthO"></output>
    <label for="alpha">Opacity</label><input id="alpha" type="range" min="10" max="100" value="100"><output id="alphaO"></output>
    <div class="full">
      <label><input id="square" type="checkbox" checked> Square grid</label>
      <label><input id="diag" type="checkbox"> Diagonals</label>
      <label><input id="labels" type="checkbox"> Labels</label>
      <label><input id="gray" type="checkbox"> Black &amp; white</label>
      <label>Color <input id="color" type="color" value="#ff3b30"></label>
    </div>
  </div>
</div>

<input id="file" type="file" accept="image/*">

<script>
(() => {
  const $ = id => document.getElementById(id);
  const view = $('view'), ctx = view.getContext('2d');
  const stage = $('stage');
  const ui = ['square','width','alpha','color','diag','labels','gray'];
  const KEY = 'goodgrid.settings.v4';
  const MAXN = 100;

  let img = null, imgW = 0, imgH = 0;
  let grayCache = null;
  let scale = 1, ox = 0, oy = 0;      // screen = img*scale + o
  let dpr = window.devicePixelRatio || 1;
  let anchor = 'cols';                // in square mode: which count the user set last
  const counts = { cols: 5, rows: 5 };  // integer counts typed by the user

  // ---------- settings ----------
  function settings() {
    return {
      square: $('square').checked,
      cols: counts.cols,
      rows: counts.rows,
      width: +$('width').value,
      alpha: +$('alpha').value / 100,
      color: $('color').value,
      diag: $('diag').checked,
      labels: $('labels').checked,
      gray: $('gray').checked,
    };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ ...settings(), anchor })); } catch {} }
  function load() {
    let s; try { s = JSON.parse(localStorage.getItem(KEY)); } catch {}
    if (!s) return;
    if (s.anchor === 'rows' || s.anchor === 'cols') anchor = s.anchor;
    for (const k of ['cols', 'rows']) if (Number.isInteger(s[k]) && s[k] >= 1) counts[k] = Math.min(MAXN, s[k]);
    for (const k of ui) {
      if (!(k in s)) continue;
      const el = $(k);
      if (el.type === 'checkbox') el.checked = !!s[k];
      else el.value = k === 'alpha' ? Math.round(s[k] * 100) : s[k];
    }
  }

  // Effective grid. Square mode: cells are exact squares sized from the count the user set last;
  // the other count follows the image aspect and may end with a partial row/column.
  function grid(s) {
    if (s.square && imgW) {
      if (anchor === 'rows') { const cell = imgH / s.rows; return { cols: imgW / cell, rows: s.rows, cellW: cell, cellH: cell }; }
      const cell = imgW / s.cols; return { cols: s.cols, rows: imgH / cell, cellW: cell, cellH: cell };
    }
    return { cols: s.cols, rows: s.rows, cellW: imgW / s.cols, cellH: imgH / s.rows };
  }
  const fmt = n => Math.abs(n - Math.round(n)) < 0.05 ? String(Math.round(n)) : n.toFixed(1);

  // Pick a "reasonable" square grid for this photo: about 5 cells on the short side,
  // preferring counts where the long side also comes out (almost) whole.
  function autoGrid() {
    const ar = Math.max(imgW, imgH) / Math.min(imgW, imgH);
    let best = 5, bestDist = Infinity;
    for (let n = 3; n <= 8; n++) {
      const long = Math.round(n * ar), err = Math.abs(long / n - ar) / ar;
      const dist = Math.abs(n - 5);
      if (err <= 0.02 && (dist < bestDist || (dist === bestDist && n < best))) { best = n; bestDist = dist; }
    }
    anchor = imgW <= imgH ? 'cols' : 'rows';
    counts[anchor] = best;
  }
  function syncUI() {
    const s = settings(), g = imgW ? grid(s) : s;
    for (const k of ['cols', 'rows']) {
      const el = $(k), follower = s.square && imgW && k !== anchor;
      if (document.activeElement !== el) el.value = follower ? fmt(g[k]) : counts[k];
      $(k + 'H').textContent = follower ? 'auto' : '';
    }
    $('widthO').textContent = s.width;
    $('alphaO').textContent = Math.round(s.alpha * 100) + '%';
  }

  // ---------- drawing ----------
  // Draws image + grid in image coordinates. `unit` = image px per screen px of line width.
  function drawScene(c, s, unit) {
    c.drawImage(s.gray ? grayCache : img, 0, 0, imgW, imgH);
    const g = grid(s);
    const nc = Math.ceil(g.cols - 1e-6), nr = Math.ceil(g.rows - 1e-6);
    c.save();
    c.beginPath(); c.rect(0, 0, imgW, imgH); c.clip();
    c.globalAlpha = s.alpha;
    c.strokeStyle = s.color;
    c.lineWidth = s.width * unit;
    c.beginPath();
    for (let i = 1; i < nc; i++) { const x = i * g.cellW; c.moveTo(x, 0); c.lineTo(x, imgH); }
    for (let j = 1; j < nr; j++) { const y = j * g.cellH; c.moveTo(0, y); c.lineTo(imgW, y); }
    c.rect(0, 0, imgW, imgH);
    c.stroke();
    if (s.diag) {
      c.lineWidth = Math.max(1, s.width * 0.6) * unit;
      c.beginPath();
      for (let i = 0; i < nc; i++) for (let j = 0; j < nr; j++) {
        const x0 = i * g.cellW, y0 = j * g.cellH, x1 = x0 + g.cellW, y1 = y0 + g.cellH;
        c.moveTo(x0, y0); c.lineTo(x1, y1);
        c.moveTo(x1, y0); c.lineTo(x0, y1);
      }
      c.stroke();
    }
    if (s.labels) {
      const fs = Math.max(Math.min(g.cellW, g.cellH) * 0.16, 11 * unit);
      c.globalAlpha = Math.min(1, s.alpha + 0.1);
      c.font = `600 ${fs}px system-ui,sans-serif`;
      c.textBaseline = 'top';
      const pad = fs * 0.25;
      for (let i = 0; i < nc; i++) for (let j = 0; j < nr; j++) {
        const t = colName(i) + (j + 1);
        const x = i * g.cellW + pad + c.lineWidth, y = j * g.cellH + pad + c.lineWidth;
        const w = c.measureText(t).width;
        if (y + fs > imgH || x + w > imgW) continue;
        c.fillStyle = 'rgba(0,0,0,0.45)';
        c.fillRect(x - pad / 2, y - pad / 2, w + pad, fs + pad / 2);
        c.fillStyle = s.color;
        c.fillText(t, x, y);
      }
    }
    c.restore();
  }
  function colName(i) { let s = ''; i++; while (i > 0) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); } return s; }

  let raf = 0;
  function render() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(); }); }
  function paint() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#111'; ctx.fillRect(0, 0, view.width, view.height);
    if (!img) return;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, ox * dpr, oy * dpr);
    ctx.imageSmoothingQuality = 'high';
    drawScene(ctx, settings(), 1 / scale);
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    const r = stage.getBoundingClientRect();
    view.width = Math.round(r.width * dpr);
    view.height = Math.round(r.height * dpr);
    render();
  }
  function fitScale() { const r = stage.getBoundingClientRect(), m = 12; return Math.min((r.width - 2 * m) / imgW, (r.height - 2 * m) / imgH); }
  function fit() {
    if (!img) return;
    const r = stage.getBoundingClientRect();
    scale = fitScale();
    ox = (r.width - imgW * scale) / 2;
    oy = (r.height - imgH * scale) / 2;
    render();
  }

  // ---------- image loading ----------
  async function loadFile(f) {
    if (!f) return;
    let bmp;
    try { bmp = await createImageBitmap(f, { imageOrientation: 'from-image' }); }
    catch {
      bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(f); });
    }
    img = bmp; imgW = bmp.width; imgH = bmp.height;
    grayCache = document.createElement('canvas');
    grayCache.width = imgW; grayCache.height = imgH;
    const g = grayCache.getContext('2d');
    // Manual luminance: ctx.filter is not applied reliably on every mobile browser.
    g.drawImage(img, 0, 0);
    const d = g.getImageData(0, 0, imgW, imgH), a = d.data;
    for (let k = 0; k < a.length; k += 4) { const y = a[k] * .299 + a[k + 1] * .587 + a[k + 2] * .114; a[k] = a[k + 1] = a[k + 2] = y; }
    g.putImageData(d, 0, 0);
    $('empty').classList.add('loaded'); $('pick').textContent = 'New photo';
    if ($('square').checked) autoGrid();
    syncUI(); save(); fit();
  }
  $('file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });

  // ---------- gestures: pinch zoom, pan, wheel, double-tap ----------
  const pts = new Map();
  let last = null, lastTap = 0, zoomTimer = 0;
  function showZoom() {
    const z = $('zoom');
    z.textContent = Math.round(scale / fitScale() * 100) + '%';
    z.classList.add('show');
    clearTimeout(zoomTimer); zoomTimer = setTimeout(() => z.classList.remove('show'), 900);
  }
  function zoomAt(f, cx, cy) {
    if (!img) return;
    const fs = fitScale();
    const ns = Math.min(fs * 30, Math.max(fs * 0.5, scale * f));
    f = ns / scale;
    ox = cx - (cx - ox) * f; oy = cy - (cy - oy) * f; scale = ns;
    showZoom(); render();
  }
  function local(e) { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function snapshot() {
    const a = [...pts.values()];
    if (a.length === 1) return { x: a[0].x, y: a[0].y, d: 0, n: 1 };
    const [p, q] = a;
    return { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2, d: Math.hypot(p.x - q.x, p.y - q.y), n: 2 };
  }
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('#empty')) return; // let the photo button get its tap
    try { stage.setPointerCapture(e.pointerId); } catch {}
    pts.set(e.pointerId, local(e));
    last = snapshot();
    if (pts.size === 1) {
      const now = Date.now();
      if (now - lastTap < 300) { fit(); showZoom(); lastTap = 0; } else lastTap = now;
    } else lastTap = 0;
  });
  stage.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, local(e));
    const cur = snapshot();
    if (!img || !last || cur.n !== last.n) { last = cur; return; }
    ox += cur.x - last.x; oy += cur.y - last.y;
    if (cur.n === 2 && last.d > 0) zoomAt(cur.d / last.d, cur.x, cur.y);
    last = cur; render();
  });
  const up = e => { pts.delete(e.pointerId); last = pts.size ? snapshot() : null; };
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', e => { e.preventDefault(); const p = local(e); zoomAt(Math.exp(-e.deltaY * 0.0015), p.x, p.y); }, { passive: false });

  // ---------- controls ----------
  for (const k of ui) $(k).addEventListener('input', () => { syncUI(); save(); render(); });
  // Turning square off: freeze the auto count to a whole number.
  $('square').addEventListener('change', () => {
    if (!$('square').checked && imgW) {
      const other = anchor === 'cols' ? 'rows' : 'cols';
      counts[other] = Math.max(1, Math.round(grid({ ...settings(), square: true })[other]));
    }
    syncUI(); save(); render();
  });
  function setCount(k, n) {
    counts[k] = Math.max(1, Math.min(MAXN, Math.round(n)));
    anchor = k;
    syncUI(); save(); render();
  }
  for (const k of ['cols', 'rows']) {
    const el = $(k);
    el.addEventListener('focus', () => el.select());
    el.addEventListener('input', () => { const n = parseFloat(el.value.replace(',', '.')); if (n >= 1) setCount(k, n); });
    el.addEventListener('change', () => { el.value = ''; el.blur(); syncUI(); });
    el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); });
    el.addEventListener('blur', () => syncUI());
  }
  for (const b of document.querySelectorAll('.num button')) b.addEventListener('click', () => {
    const k = b.dataset.for, s = settings();
    const cur = s.square && imgW && k !== anchor ? grid(s)[k] : counts[k];
    const d = +b.dataset.d, c = Math.round(cur * 10) / 10;
    setCount(k, d > 0 ? Math.floor(c) + 1 : Math.ceil(c) - 1);
  });
  $('fit').addEventListener('click', fit);
  $('pick').addEventListener('click', () => $('file').click());

  $('export').addEventListener('click', async () => {
    if (!img) { $('file').click(); return; }
    const c = document.createElement('canvas');
    c.width = imgW; c.height = imgH;
    drawScene(c.getContext('2d'), settings(), 1 / fitScale()); // line width as seen at "fit" zoom
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    const name = `grid-${Date.now()}.png`;
    const file = new File([blob], name, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Good Grid' }); return; }
      catch (err) { if (err.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  });

  if ('launchQueue' in window) {
    launchQueue.setConsumer(async p => { if (p.files && p.files.length) loadFile(await p.files[0].getFile()); });
  }

  new ResizeObserver(() => { resize(); if (img) fit(); }).observe(stage);
  load(); syncUI(); resize();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
